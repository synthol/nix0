name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 30 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: false

      - name: Check formatting
        run: |
          nix shell \
            --inputs-from . \
            --no-update-lock-file \
            --no-write-lock-file \
            nixpkgs#nixfmt \
            nixpkgs#shfmt \
            --command bash -e -o pipefail -c '
              git ls-files -z -- "*.nix" | xargs -0 -r -n 1 nixfmt --check
              git ls-files -z -- "*.sh" | xargs -0 -r -n 1 shfmt -d -i 2 -ci
            '

      - name: Check source
        run: |
          nix shell \
            --inputs-from . \
            --no-update-lock-file \
            --no-write-lock-file \
            'nixpkgs#shellcheck' \
            'nixpkgs#lua' \
            'nixpkgs#actionlint' \
            --command bash -e -o pipefail -c '
              git ls-files -z -- "*.sh" | xargs -0 -r -n 1 shellcheck
              git ls-files -z -- "*.lua" | xargs -0 -r -n 1 luac -p
              actionlint
            '

      - name: Check flake
        run: |
          nix flake check \
            --no-build \
            --no-update-lock-file \
            --no-write-lock-file

      - name: Evaluate system
        run: |
          nix eval \
            --raw \
            --no-update-lock-file \
            --no-write-lock-file \
            .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath \
            >/dev/null

      - name: Build command packages
        run: |
          nix build \
            --no-link \
            --print-build-logs \
            --no-update-lock-file \
            --no-write-lock-file \
            .#install .#vfio-info

      - name: Check disk layout
        run: |
          disko_package=$(
            nix eval \
              --impure \
              --raw \
              --expr '(builtins.getFlake (toString ./.)).inputs.disko.packages.x86_64-linux.disko.outPath'
          )

          for disko_mode in destroy,format,mount unmount; do
            "$disko_package/bin/disko" \
              --dry-run \
              --mode "$disko_mode" \
              --flake .#nixos \
              --root-mountpoint /mnt/nix0-ci
          done

      - name: Build system
        if: github.event_name == 'workflow_dispatch'
        run: |
          nix build \
            --no-link \
            --print-build-logs \
            --no-update-lock-file \
            --no-write-lock-file \
            .#nixosConfigurations.nixos.config.system.build.toplevel
