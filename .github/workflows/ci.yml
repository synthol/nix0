name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: false

      - name: Check source
        run: |
          nix shell \
            --inputs-from . \
            --no-update-lock-file \
            --no-write-lock-file \
            'nixpkgs#shellcheck' \
            'nixpkgs#lua' \
            --command bash -c \
            'shellcheck scripts/*.sh && luac -p modules/home/hyprland/*.lua'

      - name: Check flake
        run: |
          nix flake check \
            --no-build \
            --no-update-lock-file \
            --no-write-lock-file

      - name: Evaluate system
        run: |
          nix eval \
            --raw \
            --no-update-lock-file \
            --no-write-lock-file \
            .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath \
            >/dev/null
